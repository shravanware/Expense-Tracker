<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Expense Tracker</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 30px auto; padding: 0 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input, select, button { padding: 8px 12px; font-size: 14px; width: 100%; box-sizing: border-box; }
        button { background-color: #28a745; color: white; border: none; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #218838; }
        .chart-container { margin-top: 40px; }
    </style>
</head>
<body>

    <h2>Smart Expense Tracker</h2>

    <!-- Add Expense Form -->
    <form id="expenseForm">
        <div class="form-group">
            <label for="category">Category</label>
            <select id="category" required>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Bills">Bills</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="form-group">
            <label for="amount">Amount (₹ / $)</label>
            <input type="number" id="amount" step="0.01" placeholder="Enter amount" required>
        </div>

        <button type="submit">Add Expense</button>
    </form>

    <!-- Chart Container -->
    <div class="chart-container">
        <h3>Spending Breakdown</h3>
        <canvas id="expenseChart"></canvas>
    </div>

    <script>
        let myChart = null;

        // Fetch expense data from Flask API and render/update the doughnut chart
        async function loadChartData() {
            const response = await fetch('/data');
            const data = await response.json();

            const ctx = document.getElementById('expenseChart').getContext('2d');

            if (myChart) {
                myChart.destroy(); // Destroy previous chart instance before re-rendering
            }

            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: data.categories,
                    datasets: [{
                        label: 'Expense Breakdown',
                        data: data.amounts,
                        backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF']
                    }]
                }
            });
        }

        // Handle form submission via AJAX (without refreshing the page)
        document.getElementById('expenseForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const category = document.getElementById('category').value;
            const amount = document.getElementById('amount').value;

            const formData = new FormData();
            formData.append('category', category);
            formData.append('amount', amount);

            await fetch('/add', {
                method: 'POST',
                body: formData
            });

            document.getElementById('amount').value = '';
            loadChartData(); // Refresh chart immediately
        });

        // Load chart on initial page load
        loadChartData();
    </script>
</body>
</html>
